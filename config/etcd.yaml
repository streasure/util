# 单个 etcd Component 配置，注册、发现和动态配置按需启用
enabled: true
etcd:
  endpoint: "http://127.0.0.1:2379"
  endpoints:
    - "http://127.0.0.1:2379"
  dialTimeout: "5s"
  servicePrefix: "/services"
  configPrefix: "/config"
  username: ""
  password: ""
  certFile: ""
  certKeyFile: ""
  caCertFile: ""
  tlsServerName: ""

registration:
  enabled: false
  serviceID: "my-service"
  instanceID: "instance-1"
  address: "127.0.0.1:8080"
  leaseTTL: "10s"

discovery:
  enabled: false
  serviceID: "upstream-service"
  loadBalance: "round_robin"

config:
  enabled: false
  key: "/config/app.yaml"
  format: "yaml"
